<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoanTracker | Enterprise Portfolio Manager</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="apple-touch-icon" href="favicon.png" />
    <link href="LoanTracker.WasmApp.styles.css" rel="stylesheet" />
</head>
<style>
    #blazor-error-ui {
        display: none;
    }

    #blazor-error-ui[style*="block"] {
        display: flex !important;
    }
</style>

<body>
    <div id="app">
        <div class="flex items-center justify-center min-h-screen bg-premium-50">
            <div class="flex flex-col items-center gap-4">
                <div class="w-16 h-16 border-4 border-premium-500 border-t-transparent rounded-full animate-spin"></div>
                <div class="text-premium-900 font-bold text-xl tracking-tight">LoanTracker</div>
            </div>
        </div>
    </div>

    <div id="blazor-error-ui"
        class="fixed bottom-0 left-0 w-full z-50 bg-rose-900 text-white p-4 shadow-2xl items-center justify-between gap-4 border-t-2 border-rose-500/50 backdrop-blur-xl">
        <div class="flex items-center gap-3">
            <svg class="w-5 h-5 text-rose-300 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z">
                </path>
            </svg>
            <span class="text-sm font-black uppercase tracking-widest leading-relaxed">System Breach: An unhandled error
                has occurred.</span>
        </div>
        <div class="flex items-center gap-2">
            <a href=""
                class="reload px-4 py-2 bg-white text-rose-900 rounded-lg text-xs font-black uppercase tracking-widest hover:bg-rose-50 transition-colors shadow-lg shadow-black/20">Sync
                & Reload</a>
            <a class="dismiss p-2 text-rose-300 hover:text-white transition-colors cursor-pointer">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12">
                    </path>
                </svg>
            </a>
        </div>
    </div>
    <script src="https://unpkg.com/dexie/dist/dexie.js"></script>
    <script type="module" src="js/db.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>
</body>
<script>navigator.serviceWorker.register('service-worker.js');</script>
</body>

</html>
